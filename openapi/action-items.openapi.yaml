openapi: 3.1.0
info:
  title: RaidGuild Action Items API
  version: 1.0.0
  description: |
    Create, query, assign, update, and audit RaidGuild Action Items.
    Priority is a positive integer where lower values are more urgent. Effort is
    a positive integer with no prescribed unit. Items are cancelled, not deleted.
servers:
  - url: https://action-items.raidguild.org
    description: Production
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Items
  - name: Notes
  - name: Projects
  - name: History
  - name: Users
security:
  - agentBearer: []
  - portalSession: []
paths:
  /api/v1/items:
    get:
      tags: [Items]
      operationId: listActionItems
      summary: List action items
      description: Returns a cursor-paginated list ordered by priority ascending (null last), updated time descending, then ID descending.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Statuses'
        - $ref: '#/components/parameters/AssigneeId'
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
        - name: projectIds
          in: query
          description: Comma-separated project UUIDs. Matches items in any selected project.
          schema: { type: string, maxLength: 4000 }
        - name: projectAssignment
          in: query
          description: Use `unassigned` to include items that are not associated with a project. When combined with `projectIds`, either condition can match.
          schema: { type: string, enum: [unassigned] }
        - name: assignedTo
          in: query
          schema: { type: string, enum: [me, unassigned] }
          description: "`me` is available only with a Portal session."
        - name: priority
          in: query
          schema: { type: integer, minimum: 1 }
        - name: priorities
          in: query
          description: Comma-separated exact priorities, such as `1,2,4`.
          schema: { type: string, maxLength: 1000 }
        - name: priorityMin
          in: query
          schema: { type: integer, minimum: 1 }
        - name: priorityMax
          in: query
          schema: { type: integer, minimum: 1 }
        - name: effortMin
          in: query
          schema: { type: integer, minimum: 1 }
        - name: effortMax
          in: query
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of action items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Items]
      operationId: createActionItem
      summary: Create an action item
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateItemInput' }
            examples:
              p1:
                value:
                  title: Prepare the cohort kickoff brief
                  description: Gather context and draft the first version.
                  budget: 5000 USDC
                  status: open
                  priority: 1
                  effort: 3
      responses:
        '201':
          description: Item created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '200':
          description: Idempotent replay of an earlier successful creation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/items/filter-options:
    get:
      tags: [Items]
      operationId: listActionItemFilterOptions
      summary: List dynamic action-item filter options
      description: Returns the distinct non-null priorities currently in use.
      responses:
        '200':
          description: Available dynamic filter values.
          content:
            application/json:
              schema:
                type: object
                required: [priorities]
                properties:
                  priorities:
                    type: array
                    items: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Items]
      operationId: getActionItem
      summary: Get an action item and recent history
      responses:
        '200':
          description: Full item and initial history page.
          content:
            application/json:
              schema:
                type: object
                required: [item, history, notes]
                properties:
                  item: { $ref: '#/components/schemas/ActionItem' }
                  history: { $ref: '#/components/schemas/HistoryList' }
                  notes: { $ref: '#/components/schemas/NoteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Items]
      operationId: updateActionItem
      summary: Update an action item
      description: Requires the current version. A stale version returns the latest item with HTTP 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateItemInput' }
      responses:
        '200':
          description: Item updated, including any newly appended audit events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/items/{itemId}/history:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [History]
      operationId: listActionItemHistory
      summary: List immutable action-item history
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: eventType
          in: query
          schema: { type: string, enum: [created, field_changed] }
        - name: fieldName
          in: query
          schema: { type: string }
      responses:
        '200':
          description: A page of history events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/items/{itemId}/notes:
    parameters:
      - $ref: '#/components/parameters/ItemId'
    get:
      tags: [Notes]
      operationId: listActionItemNotes
      summary: List notes for an action item
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of notes, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NoteList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Notes]
      operationId: createActionItemNote
      summary: Add an attributed note to an action item
      description: A Portal session is attributed to its local user. An agent bearer principal is attributed to the local Portal user configured by the server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNoteInput' }
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema:
                type: object
                required: [note]
                properties:
                  note: { $ref: '#/components/schemas/Note' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The agent bearer principal has no valid local Portal user mapping.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Projects ordered by title.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectInput' }
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      responses:
        '200':
          description: Project details.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectInput' }
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                type: object
                required: [project]
                properties:
                  project: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/projects/{projectId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProjectDashboard
      summary: Get project intent, delivery, KPIs, and health history
      responses:
        '200':
          description: Aggregated project dashboard.
          content:
            application/json:
              schema:
                type: object
                required: [dashboard]
                properties:
                  dashboard: { $ref: '#/components/schemas/ProjectDashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{projectId}/kpis:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: createProjectKpi
      summary: Add a KPI to a project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectKpiInput' }
      responses:
        '201':
          description: KPI created.
          content:
            application/json:
              schema:
                type: object
                required: [kpi]
                properties:
                  kpi: { $ref: '#/components/schemas/ProjectKpi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/projects/{projectId}/kpis/{kpiId}/snapshots:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/KpiId'
    post:
      tags: [Projects]
      operationId: createProjectKpiSnapshot
      summary: Log a point-in-time KPI value
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectKpiSnapshotInput' }
      responses:
        '201':
          description: KPI snapshot created.
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot: { $ref: '#/components/schemas/ProjectKpiSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/projects/{projectId}/kpis/{kpiId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/KpiId'
    patch:
      tags: [Projects]
      operationId: updateProjectKpi
      summary: Update a KPI and its measurement configuration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectKpiInput' }
      responses:
        '200':
          description: KPI updated.
          content:
            application/json:
              schema:
                type: object
                required: [kpi]
                properties:
                  kpi: { $ref: '#/components/schemas/ProjectKpi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listAssignableUsers
      summary: List locally known assignable Portal users
      description: MVP users become available after their first valid Action Items launch.
      parameters:
        - $ref: '#/components/parameters/Search'
        - name: active
          in: query
          schema: { type: boolean, default: true }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of assignable users.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    agentBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Server-to-server Action Items agent credential.
    portalSession:
      type: apiKey
      in: cookie
      name: raidguild-action-items
      description: Encrypted app session created by a valid Portal launch.
  parameters:
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    KpiId:
      name: kpiId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Search:
      name: q
      in: query
      schema: { type: string, maxLength: 200 }
    Statuses:
      name: status
      in: query
      description: Comma-separated statuses, such as `open,active`.
      schema: { type: string }
    AssigneeId:
      name: assigneeId
      in: query
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 200 }
  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Version or idempotency conflict.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: Request validation failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    Status:
      type: string
      enum: [open, active, completed, cancelled]
    ProjectStatus:
      type: string
      enum: [open, closed]
    UserSummary:
      type: object
      required: [id, portalProfileId, name, handle, avatarUrl, isActive]
      properties:
        id: { type: string, format: uuid }
        portalProfileId: { type: [string, 'null'] }
        name: { type: [string, 'null'] }
        handle: { type: [string, 'null'] }
        avatarUrl: { type: [string, 'null'], format: uri }
        isActive: { type: boolean }
    ActionItem:
      type: object
      required: [id, title, description, budget, status, project, assignee, priority, effort, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 100000 }
        budget: { type: string, maxLength: 10000 }
        status: { $ref: '#/components/schemas/Status' }
        project:
          oneOf:
            - $ref: '#/components/schemas/Project'
            - type: 'null'
        assignee:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
        priority: { type: [integer, 'null'], minimum: 1, description: Lower is more urgent. }
        effort: { type: [integer, 'null'], minimum: 1, description: Unit is intentionally undefined. }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateItemInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 100000, default: '' }
        budget: { type: string, maxLength: 10000, default: '' }
        status: { $ref: '#/components/schemas/Status' }
        projectId: { type: [string, 'null'], format: uuid }
        assignedUserId: { type: [string, 'null'], format: uuid }
        priority: { type: [integer, 'null'], minimum: 1 }
        effort: { type: [integer, 'null'], minimum: 1 }
    UpdateItemInput:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 100000 }
        budget: { type: string, maxLength: 10000 }
        status: { $ref: '#/components/schemas/Status' }
        projectId: { type: [string, 'null'], format: uuid }
        assignedUserId: { type: [string, 'null'], format: uuid }
        priority: { type: [integer, 'null'], minimum: 1 }
        effort: { type: [integer, 'null'], minimum: 1 }
    Event:
      type: object
      required: [id, requestId, eventType, fieldName, oldValue, newValue, actor, createdAt]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        eventType: { type: string, enum: [created, field_changed] }
        fieldName: { type: [string, 'null'] }
        oldValue: {}
        newValue: {}
        actor:
          type: object
          required: [type, id, label]
          properties:
            type: { type: string, enum: [portal_user, agent, system] }
            id: { type: string }
            label: { type: string }
        createdAt: { type: string, format: date-time }
    Page:
      type: object
      required: [hasMore, nextCursor]
      properties:
        hasMore: { type: boolean }
        nextCursor: { type: [string, 'null'] }
    ItemList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActionItem' } }
        page: { $ref: '#/components/schemas/Page' }
    HistoryList:
      type: object
      required: [events, page]
      properties:
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        page: { $ref: '#/components/schemas/Page' }
    UserList:
      type: object
      required: [users, page]
      properties:
        users: { type: array, items: { $ref: '#/components/schemas/UserSummary' } }
        page: { $ref: '#/components/schemas/Page' }
    Project:
      type: object
      required: [id, title, description, intent, portalLinkUrl, status]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 100000 }
        intent: { type: string, maxLength: 100000 }
        portalLinkUrl: { type: [string, 'null'], format: uri }
        status: { $ref: '#/components/schemas/ProjectStatus' }
    CreateProjectInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 100000, default: '' }
        intent: { type: string, maxLength: 100000, default: '' }
        portalLinkUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
    UpdateProjectInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 300 }
        description: { type: string, maxLength: 100000 }
        intent: { type: string, maxLength: 100000 }
        portalLinkUrl: { type: [string, 'null'], format: uri, maxLength: 2048 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects: { type: array, items: { $ref: '#/components/schemas/Project' } }
    ProjectKpiSnapshot:
      type: object
      required: [id, value, note, capturedAt]
      properties:
        id: { type: string, format: uuid }
        value: { type: number }
        note: { type: string }
        capturedAt: { type: string, format: date-time }
    ProjectKpi:
      type: object
      required: [id, name, description, unit, source, sourceUrl, measurementConfig, baselineValue, targetValue, weight, currentValue, progress, snapshots]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        unit: { type: string }
        source: { type: string }
        sourceUrl: { type: [string, 'null'], format: uri }
        measurementConfig:
          oneOf:
            - { $ref: '#/components/schemas/PlausibleMeasurementConfig' }
            - { type: 'null' }
        baselineValue: { type: number }
        targetValue: { type: number }
        weight: { type: integer, minimum: 1, maximum: 10 }
        currentValue: { type: [number, 'null'] }
        progress: { type: [number, 'null'], minimum: 0, maximum: 1 }
        snapshots: { type: array, items: { $ref: '#/components/schemas/ProjectKpiSnapshot' } }
    CreateProjectKpiInput:
      type: object
      additionalProperties: false
      required: [name, baselineValue, targetValue]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000, default: '' }
        unit: { type: string, default: number }
        source: { type: string, default: manual }
        sourceUrl: { type: [string, 'null'], format: uri }
        measurementConfig:
          oneOf:
            - { $ref: '#/components/schemas/PlausibleMeasurementConfig' }
            - { type: 'null' }
        baselineValue: { type: number }
        targetValue: { type: number }
        weight: { type: integer, minimum: 1, maximum: 10, default: 1 }
    UpdateProjectKpiInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 10000 }
        unit: { type: string }
        source: { type: string }
        sourceUrl: { type: [string, 'null'], format: uri }
        measurementConfig:
          oneOf:
            - { $ref: '#/components/schemas/PlausibleMeasurementConfig' }
            - { type: 'null' }
        baselineValue: { type: number }
        targetValue: { type: number }
        weight: { type: integer, minimum: 1, maximum: 10 }
    PlausibleMeasurementConfig:
      type: object
      additionalProperties: false
      required: [provider, siteIds, metric, aggregation, dateRange, campaignFilter, sharedGoalName, siteGoalOverrides, requireCompleteCoverage]
      properties:
        provider: { type: string, const: plausible }
        siteIds: { type: array, minItems: 1, maxItems: 25, uniqueItems: true, items: { type: string } }
        metric: { type: string, enum: [visitors, visits, pageviews, views_per_visit, bounce_rate, visit_duration, events, scroll_depth, conversion_rate, group_conversion_rate, time_on_page] }
        aggregation: { type: string, enum: [sum, average, minimum, maximum] }
        dateRange:
          oneOf:
            - type: object
              additionalProperties: false
              required: [type, days]
              properties:
                type: { type: string, const: rolling }
                days: { type: integer, minimum: 1, maximum: 365 }
            - type: object
              additionalProperties: false
              required: [type, start, end]
              properties:
                type: { type: string, const: fixed }
                start: { type: string, format: date }
                end: { type: string, format: date }
        campaignFilter:
          oneOf:
            - type: object
              additionalProperties: false
              required: [property, value]
              properties:
                property: { type: string, enum: ['visit:utm_campaign', 'visit:utm_source', 'visit:utm_medium', 'visit:utm_content', 'visit:utm_term', 'visit:source'] }
                value: { type: string, minLength: 1, maxLength: 200 }
            - type: 'null'
        sharedGoalName: { type: [string, 'null'] }
        siteGoalOverrides:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            required: [siteId, goalName]
            properties:
              siteId: { type: string }
              goalName: { type: string }
        requireCompleteCoverage: { type: boolean }
    CreateProjectKpiSnapshotInput:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: number }
        note: { type: string, maxLength: 2000, default: '' }
        capturedAt: { type: string, format: date-time }
    ProjectDashboard:
      type: object
      required: [project, health, delivery, kpis]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        health:
          type: object
          required: [score, change, history]
          properties:
            score: { type: [integer, 'null'], minimum: 0, maximum: 100 }
            change: { type: [integer, 'null'] }
            history:
              type: array
              items:
                type: object
                required: [capturedAt, score]
                properties:
                  capturedAt: { type: string, format: date-time }
                  score: { type: integer, minimum: 0, maximum: 100 }
        delivery:
          type: object
          required: [total, completed, active, open, cancelled, completionRate]
          properties:
            total: { type: integer }
            completed: { type: integer }
            active: { type: integer }
            open: { type: integer }
            cancelled: { type: integer }
            completionRate: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        kpis: { type: array, items: { $ref: '#/components/schemas/ProjectKpi' } }
    Note:
      type: object
      required: [id, text, user, createdAt]
      properties:
        id: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 100000 }
        user: { $ref: '#/components/schemas/UserSummary' }
        createdAt: { type: string, format: date-time }
    CreateNoteInput:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 100000 }
    NoteList:
      type: object
      required: [notes, page]
      properties:
        notes: { type: array, items: { $ref: '#/components/schemas/Note' } }
        page: { $ref: '#/components/schemas/Page' }
    MutationResult:
      type: object
      required: [item, events, requestId]
      properties:
        item: { $ref: '#/components/schemas/ActionItem' }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        requestId: { type: string, format: uuid }
        replayed: { type: boolean }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId, details]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string, format: uuid }
            details: { type: object, additionalProperties: true }
